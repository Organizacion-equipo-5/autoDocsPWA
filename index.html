<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoDocs AI · Documentación automática de código</title>
  <meta name="description" content="AutoDocs AI analiza el código de tu proyecto y genera su documentación técnica: estructura, funciones, endpoints, métricas y diagramas.">
  <meta name="theme-color" content="#0f1418">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"></noscript>
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('autodocs-tema') || 'dark'; } catch (e) {}</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <canvas id="fx" aria-hidden="true"></canvas>

  <header class="top">
    <a class="brand" href="#/" aria-label="AutoDocs AI, ir al inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      <span>Auto<b>Docs</b> AI</span>
    </a>
    <nav class="nav-links" aria-label="Secciones">
      <a href="#/" data-scroll="features">Funciones</a>
      <a href="#/" data-scroll="how">Cómo funciona</a>
      <a href="#/" data-scroll="stack">Stack</a>
      <a href="#/" data-scroll="pricing">Planes</a>
    </nav>
    <div class="top-right">
      <button id="instalar" class="btn small" type="button" hidden>Instalar app</button>
      <span id="net" class="pill" role="status">En línea</span>
      <a class="btn small solo-pc" href="#/estado">Estado</a>
      <a class="btn small solo-pc" href="#/proyectos">Mis proyectos</a>
      <a class="btn small primary solo-pc" href="#/nuevo">Analizar ahora</a>
    </div>
  </header>

  <div id="update" class="banner" role="alert" hidden>
    <span>Hay una versión nueva de AutoDocs AI.</span>
    <button id="btn-update" class="btn small primary" type="button">Actualizar ahora</button>
  </div>

  <main id="main" tabindex="-1"></main>

  <button id="tema" class="theme-float glass" type="button" aria-label="Cambiar a tema claro">☀</button>

  <nav class="tabs" aria-label="Principal">
    <a href="#/" data-tab="">Inicio</a>
    <a href="#/proyectos" data-tab="proyectos">Proyectos</a>
    <a href="#/nuevo" data-tab="nuevo">Analizar</a>
    <a href="#/estado" data-tab="estado">Estado</a>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>AutoDocs AI necesita JavaScript para funcionar.</noscript>
  <script type="module" src="js/fx.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
